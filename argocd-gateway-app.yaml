apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: visits-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/suryamjv/devops-practice.git
    targetRevision: main
    path: k8s
    directory:
      include: 'gateway.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: visits
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

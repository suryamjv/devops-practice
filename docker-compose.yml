services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: visitsdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d visitsdb"]
      interval: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: visitsdb
      DB_USER: appuser
      DB_PASSWORD: changeme
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: